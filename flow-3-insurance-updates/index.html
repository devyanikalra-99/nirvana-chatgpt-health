<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow 3 — Insurance Updates Triggered to ChatGPT Users</title>
<style>
  :root{
    color-scheme: light;
    --page:#e9e9ec; --page-ink:#1c1c1e; --page-muted:#6e6e73;
    --phone:#ffffff; --ink:#0f0f10; --muted:#8a8a8f; --line:#e5e5ea; --soft:#f2f2f5;
    --blue:#3b7cf6; --blue-bg:#eef3ff;
    --green:#1fa35b; --green-bg:#e7f7ee;
    --nirvana:#5a3fd1; --nirvana-bg:#efeafc;
    --bubble:#eaf0ff; --bubble-ink:#2c4fcf;
    --shadow: 0 30px 60px rgba(20,20,30,.18), 0 2px 6px rgba(20,20,30,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --page:#121214; --page-ink:#f2f2f4; --page-muted:#9a9aa1;
      --phone:#0d0d10; --ink:#f3f3f5; --muted:#8e8e95; --line:#26262b; --soft:#1a1a1f;
      --blue:#5b93ff; --blue-bg:#15213d;
      --green:#38c172; --green-bg:#0f2a1b;
      --nirvana:#a08cff; --nirvana-bg:#241d44;
      --bubble:#1b2a55; --bubble-ink:#b9c9ff;
      --shadow: 0 30px 60px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--page);color:var(--page-ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;justify-content:center;padding:36px 16px 60px}

  .stage{display:flex;flex-direction:column;align-items:center}
  .ctrl{width:390px;display:flex;flex-direction:column;gap:14px;margin-top:18px}
  .bars{display:flex;gap:4px}
  .bars i{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
  .bars i b{position:absolute;inset:0;width:0;background:var(--page-ink)}
  .bars i.done b{width:100%}
  .bars i.on b{transition:width linear}
  .btns{display:flex;gap:10px;justify-content:center}
  .btns button{font:inherit;font-size:13px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--phone);color:var(--ink);cursor:pointer;min-width:84px}
  .btns button:focus-visible,.phone button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ---------- phone ---------- */
  .phone{width:390px;height:844px;background:var(--phone);border-radius:52px;box-shadow:var(--shadow);position:relative;overflow:hidden;border:10px solid #111;flex:none}
  .island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:116px;height:34px;background:#000;border-radius:20px;z-index:6}
  .status{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:16px 32px 0;font-size:15px;font-weight:600;color:var(--ink);background:var(--phone);z-index:5}
  .status .r{display:flex;gap:6px;align-items:center;font-size:12px}
  .status .batt{border:1.5px solid currentColor;border-radius:4px;padding:0 4px;font-size:10px;line-height:13px}
  .layer{position:absolute;inset:0;overflow:auto;scrollbar-width:none;padding-top:52px;display:flex;flex-direction:column;color:var(--ink);background:var(--phone);will-change:transform,opacity}
  .layer.hidden{visibility:hidden}
  .layer.lockish{padding-top:0;background:transparent}
  .fixed{transition:opacity .3s}
  @keyframes pushIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
  @keyframes pushOut{from{transform:translateX(0)}to{transform:translateX(-28%)}}
  @keyframes slideInL{from{transform:translateX(-100%)}to{transform:translateX(0)}}
  @keyframes slideOutR{from{transform:translateX(0)}to{transform:translateX(28%)}}
  @keyframes zoomIn{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  .a-pushIn{animation:pushIn .46s cubic-bezier(.32,.72,0,1) both;z-index:2}
  .a-pushOut{animation:pushOut .46s cubic-bezier(.32,.72,0,1) both}
  .a-slideInL{animation:slideInL .46s cubic-bezier(.32,.72,0,1) both;z-index:2}
  .a-slideOutR{animation:slideOutR .46s cubic-bezier(.32,.72,0,1) both}
  .a-zoomIn{animation:zoomIn .5s cubic-bezier(.2,.8,.2,1) both;z-index:2}
  .a-fadeIn{animation:fadeIn .4s ease both;z-index:2}
  .a-fadeOut{animation:fadeOut .4s ease both}
  @media (prefers-reduced-motion:reduce){[class*="a-"]{animation-duration:.01s}}
  .layer::-webkit-scrollbar{display:none}
  .phone button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .fixed{position:absolute;left:0;right:0;bottom:0;z-index:4;pointer-events:none}
  .fixed > *{pointer-events:auto}

  .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;position:sticky;top:0;background:var(--phone);z-index:3}
  .bar .t{font-size:17px;font-weight:600}
  .circ{width:38px;height:38px;border-radius:50%;background:var(--phone);box-shadow:0 1px 6px rgba(0,0,0,.12);display:grid;place-items:center;font-size:18px}
  .circ svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

  .body{padding:8px 16px 120px;display:flex;flex-direction:column;gap:14px}
  .h2{font-size:26px;font-weight:600;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}
  .h2 small{font-size:22px;color:var(--muted);font-weight:300}
  .starts{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
  .starts::-webkit-scrollbar{display:none}
  .start{scroll-snap-align:start}
  .start{flex:none;width:290px;border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center}
  .start .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
  .start b{display:block;font-size:14px;font-weight:600}
  .start span{font-size:13px;color:var(--muted);line-height:1.3}
  .tabs{display:flex;justify-content:space-between;padding:2px 0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;padding:9px 9px;border-radius:999px;font-size:13.5px;color:var(--muted);letter-spacing:-.02em;white-space:nowrap}
  .tabs button.on{background:var(--soft);color:var(--ink);font-weight:500}

  .card{border:1px solid var(--line);border-radius:22px;padding:4px 16px}
  .card .ct{font-size:19px;font-weight:600;padding:14px 0 6px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);gap:12px}
  .row.first{border-top:0}
  .row .l{font-size:14.5px}
  .row .l small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
  .row .v{font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
  .row .v small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .spark{display:flex;gap:4px;align-items:flex-end;height:28px}
  .spark i{width:5px;background:var(--blue);border-radius:3px}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.green{background:var(--green-bg);color:var(--green)}
  .pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}

  .stages{display:flex;flex-direction:column;gap:8px;padding:14px 0 12px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 14px}
  .tile{border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px}
  .tile .lb{font-size:12px;color:var(--muted)}
  .tile .vl{font-size:18px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
  .tile .vl.ok{color:var(--green)}
  .tile .sb{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.35}
  .tile .meter{margin-top:8px;height:6px}
  .stg{display:block;border:1px solid var(--line);border-radius:14px;padding:10px 14px 11px;text-align:left}
  .stg .lr{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stg small{display:block;font-size:12.5px;color:var(--muted)}
  .stg b{display:block;font-size:15px;font-weight:600;margin-top:3px;white-space:nowrap}
  .stg .you{display:none;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--ink);color:var(--phone);white-space:nowrap}
  .stg.here{border-color:var(--ink);background:var(--soft)}
  .stg.here .you{display:inline-block}
  .stg.done{opacity:.5}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 14px}
  .tile{border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px}
  .tile .lb{font-size:12px;color:var(--muted)}
  .tile .vl{font-size:18px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
  .tile .vl.ok{color:var(--green)}
  .tile .sb{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.3}
  .tile .meter{margin-top:8px;height:6px}
  .stg{border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
  .stg small{display:block;font-size:11px;color:var(--muted);line-height:1.3;min-height:28px}
  .stg b{display:block;font-size:17px;font-weight:600;margin-top:4px}
  .stg.here{border-color:var(--ink);background:var(--soft)}
  .stg.here .you{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--phone);margin-bottom:6px}
  .stg .you{display:none}
  .stg.done{opacity:.5}

  .meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:var(--blue);border-radius:4px}
  .meter i.full{background:var(--green)}
  .meter-row{padding:13px 0;border-top:1px solid var(--line)}
  .meter-row .top{display:flex;justify-content:space-between;font-size:14.5px}
  .meter-row .top b{font-weight:600}
  .meter-row .sub{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}

  .vc{display:grid;grid-template-columns:1fr 86px 86px;gap:6px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
  .vc .n,.vc .b,.vc .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vc.head{border-top:0;padding:0 0 8px;font-size:11.5px;color:var(--muted);line-height:1.25;align-items:end}
  .vc.head span:nth-child(n+2){text-align:right}
  .vc .n{font-size:14.5px}
  .vc .n small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
  .vc .b{text-align:right;font-size:12.5px;color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(128,128,128,.5)}
  .vc .a{text-align:right;font-size:14.5px;font-weight:600}
  .vc .a.free{color:var(--green)}
  .vc.ded-open .b{text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
  .vc.ded-open .a{color:var(--muted);font-weight:400;font-size:13px}

  .via{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px 4px}
  .via .logo{width:18px;height:18px;border-radius:5px;background:var(--nirvana);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}

  .compose{margin:0 14px 18px;min-height:58px;border-radius:30px;background:var(--phone);box-shadow:0 2px 14px rgba(0,0,0,.14);display:flex;align-items:center;padding:9px 9px 9px 18px;gap:12px;font-size:17px;color:var(--muted)}
  .compose .typed{color:var(--ink);font-size:15.5px;flex:1;line-height:1.3;padding:4px 0}
  .compose .ph{flex:1}
  .compose .send{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:17px;flex:none;align-self:flex-end}
  .compose .mic{font-size:20px}
  .compose .plus{font-size:26px;font-weight:300;color:var(--ink);align-self:flex-end;line-height:40px}
  .disclaimer{text-align:center;font-size:10.5px;color:var(--muted);padding:0 20px 8px;background:var(--phone)}
  .fixed .bg{position:absolute;inset:0;top:-10px;background:linear-gradient(to bottom,transparent,var(--phone) 30%);z-index:-1}

  /* sidebar */
  .side{padding:8px 20px 0;display:flex;flex-direction:column;gap:2px}
  .side .brand{display:flex;justify-content:space-between;align-items:center;padding:4px 0 14px;font-size:22px;font-weight:700;letter-spacing:-.02em}
  .side .it{display:flex;align-items:center;gap:14px;padding:12px 10px;font-size:17px;border-radius:14px}
  .side .it.on{background:var(--soft)}
  .side .it .ico{width:22px;text-align:center;font-size:16px}
  .side .sec{font-size:17px;font-weight:600;padding:18px 10px 6px}
  .side .rec{padding:11px 10px;font-size:16.5px}
  .side .rec.muted{color:var(--muted)}
  .sidefoot{position:absolute;bottom:22px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:center}
  .sidefoot .chatbtn{background:#3b56e8;color:#fff;padding:12px 28px;border-radius:999px;font-weight:600;font-size:17px}
  .peek{position:absolute;top:0;right:0;bottom:0;width:62px;background:var(--phone);border-left:1px solid var(--line);border-radius:40px 0 0 40px;box-shadow:-10px 0 30px rgba(0,0,0,.08)}

  /* chat */
  .chat{padding:10px 14px 170px;display:flex;flex-direction:column;gap:16px}
  .me{align-self:flex-end;max-width:84%;background:var(--bubble);color:var(--bubble-ink);padding:12px 16px;border-radius:22px;font-size:16px;line-height:1.35}
  .ai{font-size:15.5px;line-height:1.45;display:flex;flex-direction:column;gap:12px}
  .ai p strong{font-weight:600}
  .ai ul{padding-left:18px;display:flex;flex-direction:column;gap:5px}
  .thinking{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
  .thinking i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);animation:spin 1s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.thinking i{animation:none}}

  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 14px 10px;margin:0 -14px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .doc{flex:none;width:300px;scroll-snap-align:start;border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--phone)}
  .doc .top{display:flex;gap:12px;align-items:center}
  .doc .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff;flex:none}
  .doc .nm{font-size:16px;font-weight:600;line-height:1.2}
  .doc .sp{font-size:13px;color:var(--muted)}
  .doc .rt{display:flex;align-items:center;gap:8px;font-size:14px}
  .doc .stars{color:#f0a500;letter-spacing:1px;font-size:15px}
  .doc .rt small{color:var(--muted);font-size:12px}
  .doc .kv{font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:5px}
  .doc .kv div{display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc .kv span{color:var(--muted);width:68px;flex:none}
  .doc .kv{font-size:12.5px}
  .doc .nm,.doc .sp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc .cost{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:baseline}
  .doc .cost b{font-size:19px;font-weight:600}
  .doc .cost small{color:var(--muted);font-size:12px;display:block;margin-top:2px}
  .doc .slots{display:flex;flex-direction:column;gap:6px}
  .doc .slots .lbl{font-size:12.5px;color:var(--muted)}
  .doc .slots .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .doc .slots button{padding:8px 4px;border-radius:999px;border:1px solid var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap;text-align:center}
  .doc .slots button.sel{background:var(--ink);color:var(--phone)}
  .railhint{font-size:12px;color:var(--muted);text-align:center}

  .action{align-self:flex-end;display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:16px;padding:10px 14px;font-size:13.5px;max-width:88%}
  .action .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:600;flex:none}
  .action b{display:block;font-size:14px}
  .mail{border:1px solid var(--line);border-radius:18px;overflow:hidden;font-size:13px}
  .mail .mh{padding:10px 14px;background:var(--soft);display:flex;flex-direction:column;gap:3px;color:var(--muted)}
  .mail .mh b{color:var(--ink);font-weight:600}
  .mail .mb{padding:12px 14px;line-height:1.5;color:var(--ink)}
  .mail .mb p+p{margin-top:8px}
  .acts2{display:flex;gap:8px}
  .acts2 button{flex:1;padding:11px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid var(--line)}
  .acts2 button.sendmail{background:var(--ink);color:var(--phone);border-color:var(--ink)}
  .mail .mb ul{padding-left:18px;margin:6px 0}
  .mail .mb ul ul{margin:2px 0 0}
  .mail .mb li{margin:2px 0}
  @keyframes zoomOut{from{transform:scale(1);opacity:1}to{transform:scale(.86);opacity:0}}
  .a-zoomOut{animation:zoomOut .5s cubic-bezier(.2,.8,.2,1) both}
  .status-pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .status-pill i{width:8px;height:8px;border-radius:50%;background:#f0a500}

  /* lock */
  .lock{position:absolute;inset:0;background:linear-gradient(170deg,#1b2340 0%,#2d3a74 45%,#5a6fb8 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:88px}
  .lock .time{font-size:84px;font-weight:300;letter-spacing:-.03em;line-height:1}
  .lock .date{font-size:20px;font-weight:500;margin-bottom:34px}
  .notif{width:356px;background:rgba(255,255,255,.86);backdrop-filter:blur(30px);color:#111;border-radius:24px;padding:14px 16px;display:flex;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .notif .app{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:20px;flex:none;border:1px solid #ddd}
  .notif .tt{display:flex;justify-content:space-between;font-size:13px;color:#555}
  .notif b{display:block;font-size:14.5px;margin-top:2px}
  .notif p{font-size:14px;line-height:1.3;color:#222;margin-top:2px}
  .lock .hint{margin-top:auto;margin-bottom:22px;font-size:13px;opacity:.75}
  .lock .flash{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#fff;opacity:.9}

  .visits{border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .visit{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px;align-items:flex-start}
  .visit:first-child{border-top:0}
  .visit .dt{width:50px;flex:none;color:var(--muted);font-size:12.5px;line-height:1.3}
  .visit .what{flex:1;line-height:1.3}
  .visit .what small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .visit .amt{font-weight:600;white-space:nowrap}
  .visit.hi{background:var(--green-bg)}
  .src{font-size:12px;color:var(--muted);padding:8px 14px;background:var(--soft);display:flex;gap:6px;align-items:center}
  .rec-card{border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .rec-card .hd{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:600}
  .rec-card .hd .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--soft)}
  .rec-card p{font-size:13.5px;line-height:1.45}
  .rec-card p.q{color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:10px}
  .rec-card .acts{display:flex;gap:8px;margin-top:4px}
  .rec-card .acts button{flex:1;padding:10px;border-radius:999px;font-size:13.5px;font-weight:600;border:1px solid var(--line)}
  .rec-card .acts button.pri{background:var(--ink);color:var(--phone);border-color:var(--ink)}

  /* iOS home screen (original icon set, iOS proportions) */

const scallop = (() => { const n=8, R=9.6, r=7.8, pts=[]; for(let i=0;i<n*2;i++){ const a=Math.PI*i/n, rr=i%2?r:R; pts.push([12+rr*Math.cos(a),12+rr*Math.sin(a)]); } let d=""; for(let i=0;i<pts.length;i++){ const [x,y]=pts[i], [nx,ny]=pts[(i+1)%pts.length], [px,py]=pts[(i-1+pts.length)%pts.length]; const mx1=(px+x)/2,my1=(py+y)/2,mx2=(x+nx)/2,my2=(y+ny)/2; d += (i?"":`M${mx1} ${my1}`)+` Q${x} ${y} ${mx2} ${my2}`; } return d+"Z"; })();

    <div class="acct" style="border:0"><div class="av">❤️</div><div><b>Apple Health</b><span>Connected</span></div></div>
    <div class="acct" style="border:0"><div class="av nv">N</div><div><b>Nirvana</b><span>Connected</span></div></div>
  </div></div>`;
S.insurance = (stage) => `${bar("Health")}<div class="body">${getStarted(GS)}${tabs("Insurance")}${insuranceTab(stage)}</div>`;
const sheetHTML = `
  <div class="hd"><div class="pg"><i></i><i></i><i></i><i></i></div><div class="x" id="sheetX">✕</div></div>
  <h3>Connect more accounts</h3>
  <p>Add your health accounts for personalized responses and proactive insights</p>
  <div class="srch">⌕ Search</div>
  <div class="list">
    <div class="acct"><div class="av" style="background:var(--phone);border:1px solid var(--line);font-size:17px">❤️</div><div><b>Apple Health</b><span>Synced first 30 days…</span></div><div class="ok">✓</div></div>
    <div class="acct"><div class="av nv">N</div><div><b>Nirvana</b><span>Insurance connected</span></div><div class="ok">✓</div></div>
    ${[["FH","Function Health"],["OM","One Medical"],["MS","Mount Sinai"],["NYU","NYU Langone"],["NYP","New York Presbyterian"],["MH","Montefiore Health System"],["UM","University of Maryland Medical System"],["CH","Catholic Health Buffalo"]].map(([a,n])=>`<div class="acct"><div class="av">${a}</div><div><b>${n}</b></div><div class="add">+</div></div>`).join("")}
  </div>
  <div class="cont" id="sheetGo">Continue</div>`;

S.sidebar = () => `
  <div class="side">
    <div class="brand">ChatGPT <span class="circ">⌕</span></div>
    ${[["library","Library"],["projects","Projects"],["plugins","Plugins"],["scheduled","Scheduled"],["codex","Codex"],["explore","Explore"]].map(([i,t])=>`<div class="it">${SI[i]}${t}</div>`).join("")}
    <div class="sec">Pinned</div>
    <div class="it on" id="sideHealth">${SI.health}Health</div>
    <div class="sec">Recents</div>
    ${["Marathon training plan, week 6","Lease renewal negotiation","Dal makhani recipe","Lisbon packing list","Fix leaky kitchen faucet"].map(t=>`<div class="rec">${t}</div>`).join("")}
    <div class="rec muted">See all…</div>
    <div class="sidefoot"><span class="chatbtn">✎ Chat</span><span class="circ">⚙</span></div>
  </div>`;

S.thinking = () => `${bar("", svgBack)}<div class="chat">
    <div class="me">${Q}</div>
    <div class="thinking"><i></i>Identifying top in-network providers within 5 miles of your home…</div>
  </div>`;

S.results = (selSlot) => `${bar("", svgBack)}<div class="chat">
    <div class="me">${Q}</div>
    <div class="ai">
      <p>Sorry you're feeling rough. Flu is treatable, and antivirals work best in the first 48 hours, so same-day is worth it. Here are 10 in-network doctors within 5 miles who can see you today or tomorrow, highest rated first. Tap a slot and I'll request it for you.</p>
      <div class="rail" id="rail">${doctors.map(d=>docCard(d, selSlot)).join("")}</div>
            <p style="font-size:13px;color:var(--muted)">If you have trouble breathing, chest pain, or a fever above 103°F that won't come down, go to urgent care or the ER now instead of waiting for an appointment.</p>
    </div>
  </div>`;

const lastName = d => d.n.split(" ").slice(-1)[0];
const emailCard = d => `<div class="mail">
        <div class="mh"><span>To <b>${d.em}</b></span><span>From <b>jordan.alvarez@gmail.com</b></span><span>Subject <b>Appointment for Jordan Alvarez</b></span></div>
        <div class="mb">
          <p>Hi Dr. ${lastName(d)}'s office,</p>
          <p>I've been experiencing a fever and cough for the last few days and think I may have the flu, so I'd like to schedule an appointment as soon as possible. I noticed Dr. ${lastName(d)} has availability at ${picked.slot.split(" ").slice(1).join(" ")} on ${picked.slot.split(" ")[0]} and would like to come in at that time. Please see my insurance details below:</p>
          <ul>
            <li>Name: ${plan.name}</li>
            <li>Date of Birth: ${plan.dob}</li>
            <li>Payer: ${plan.payer} (${plan.type})
              <ul><li>Member ID: ${plan.memberId}</li><li>${plan.group}</li></ul></li>
          </ul>
          <p>Please confirm by reply or at (917) 555-0136. Thank you!</p>
          <p>Jordan</p>
        </div>
      </div>`;
const chatHead = d => `<div class="me">${Q}</div>
    <div class="ai"><p>Here are 10 in-network doctors within 5 miles who can see you today or tomorrow, highest rated first.</p>
      <div class="railhint" style="text-align:left;padding:4px 0">10 doctors · list collapsed</div></div>
    <div class="action"><span class="av" style="background:${d.c}">${initials(d.n)}</span><span><b>${d.n}</b>${picked.slot}</span></div>`;
S.draft = () => { const d = picked.doc; return `${bar("", svgBack)}<div class="chat">
    ${chatHead(d)}
    <div class="ai">
      <p>Here's the email I've drafted to Dr. ${lastName(d)}'s office requesting the ${picked.slot} slot. It includes your symptoms and insurance details. Want me to send it?</p>
      ${emailCard(d)}
      <div class="acts2"><button class="sendmail">Send email</button><button>Edit</button></div>
    </div>
  </div>`; };
S.sent = () => { const d = picked.doc; return `${bar("", svgBack)}<div class="chat">
    ${chatHead(d)}
    <div class="ai"><p>Here's the email I've drafted to Dr. ${lastName(d)}'s office requesting the ${picked.slot} slot. Want me to send it?</p>
      <div class="railhint" style="text-align:left;padding:4px 0">Email draft · collapsed</div></div>
    <div class="me">Yes, please send</div>
    <div class="ai">
      <p><strong>Email sent</strong> to ${d.em}. Your estimated cost for the visit is <strong>${money(d.fee*plan.coins/100)}</strong> (session cost ${money(d.fee)}; you pay ${plan.coins}% since your deductible is met).</p>
      <p>I'll notify you as soon as the office confirms your appointment and add it to your calendar.</p>
      <div class="status-pill"><i></i>Waiting for confirmation from Dr. ${lastName(d)}'s office</div>
    </div>
  </div>`; };

S.lock = () => `<div class="lock">
    <div class="time">9:41</div><div class="date">Friday, November 6</div>
    <div class="notif"><div class="app">🛡️</div><div style="flex:1">
      <div class="tt"><span>ChatGPT · Health</span><span>now</span></div>
      <b>You've hit your out-of-pocket max</b>
      <p>Your United Healthcare plan now covers in-network care at 100% through Dec 31. Two things look worth booking.</p></div></div>
    <div class="hint">Tap to open</div><div class="flash"></div></div>`;

S.oopChat = () => `${bar("", svgBack)}<div class="chat">
    <div class="ai">
      <p><strong>You've met your out-of-pocket max for 2026.</strong> The chest X-ray and labs completed on October 30th pushed you over, so from now until Dec 31 in-network care is covered in full.</p>
      <div class="card" style="padding:4px 14px"><div class="meter-row" style="border-top:0">
        <div class="top"><span>Out-of-pocket max</span><b style="color:var(--green)">Met</b></div>
        <div class="meter"><i class="full" style="width:100%"></i></div>
        <div class="sub"><span>$4,000 of $4,000</span><span>Reached Nov 4</span></div></div></div>
      <p>Two things you can get fully covered before the year resets:</p>
      <div class="rec-card"><div class="hd"><span class="ic">🦷</span>Second dental cleaning</div>
        <p class="q">"Recommend 2 cleanings per year given history of gingivitis; next due September." — Dr. Lee, visit summary, Mar 9</p>
        <p>You're two months past due. Cleanings are covered in full on your UHC Dental plan, and Grand Central Dental has openings next week.</p>
        <div class="acts"><button class="pri">See openings</button><button>Remind me</button></div></div>
      <div class="rec-card"><div class="hd"><span class="ic">👓</span>A new pair of glasses</div>
        <p>Your vision benefit still has the full 2026 allowance unused: one eye exam, lenses, and $200 toward frames. Your last prescription is from October 2024, so an exam plus new glasses would cost you $0 at an in-network optometrist. Your $410 FSA can cover anything over the frame allowance.</p>
        <div class="acts"><button class="pri">Find in-network optometrists</button></div></div>
      <p style="font-size:13px;color:var(--muted)">One note: the out-of-pocket max applies to your medical plan. Dental and vision are separate benefits, which is why I checked those allowances directly.</p>
      <p>Here's how you got here, pulled from the visit receipts in your Gmail:</p>
      <div class="visits">${visits.map(v=>`<div class="visit ${v.hi?'hi':''}"><div class="dt">${v.d}</div><div class="what">${v.w}<small>${v.s}</small></div><div class="amt">${money(v.a)}</div></div>`).join("")}
        <div class="src">📧 Source: 19 receipt and visit-summary emails, Jan–Nov 2026</div></div>
    </div></div>`;

/* ============================================================ FLOWS
   anim: how the step's screen enters. same:true = keep current DOM (scroll/mutate only) */
const flows = [
  { name:"Flow 1", steps:[
      {r:S.ios, fixed:"", lock:true, anim:"fade", tap:"#appGPT", dur:1700},
      {r:S.home, fixed:compose(), clock:"11:25", anim:"zoom", drawer:true, tap:"#sideHealth", dur:2000},
      {same:true, closeDrawer:true, tap:'[data-tab="Insurance"]', dur:1700},
      {r:()=>S.insurance(2), fixed:compose(), clock:"11:25", anim:"fade", dur:1900},
      {same:true, scroll:{y:9999, t:3400}, dur:3900},
  ]},
  { name:"Flow 2", steps:[
      {r:S.home, fixed:compose(Q), clock:"11:23", anim:"fade", type:Q, tap:".send", dur:3600},
      {r:S.thinking, fixed:compose()+disclaimer, clock:"11:23", anim:"push", dur:1700},
      {r:()=>S.results(), fixed:compose()+disclaimer, clock:"11:24", anim:"fade", scroll:{y:150, t:1000}, dur:2500},
      {same:true, scroll:{y:230, x:312*5, t:4400}, dur:4900},
      {same:true, scroll:{x:0, t:1100}, tap:".doc:first-child .slots button:first-child", mutate:()=>document.querySelector(".layer:not(.hidden) .doc:first-child .slots button")?.classList.add("sel"), dur:2200},
      {r:S.draft, fixed:compose("Yes, please send")+disclaimer, clock:"11:25", anim:"fade", type:"Yes, please send", typeDelay:2500, scroll:{y:9999, t:2000}, tap:".send", dur:6000},
      {r:S.sent, fixed:compose()+disclaimer, clock:"11:25", anim:"fade", scroll:{y:9999, t:1000}, dur:4000},
      {r:S.ios, fixed:"", lock:true, anim:"close", dur:2000},
  ]},
  { name:"Flow 3", steps:[
      {r:S.lock, fixed:"", lock:true, anim:"fade", tap:".notif", dur:2600},
      {r:S.oopChat, fixed:compose()+disclaimer, clock:"9:41", anim:"zoom", stage:3, dur:4200},
      {same:true, scroll:{y:9999, t:6200}, dur:7000},
      {r:()=>S.insurance(3), fixed:compose(), clock:"9:42", anim:"push", scroll:{y:9999, t:3200}, dur:4200},
  ]},
];

/* ============================================================ PLAYER */
const seq = (MODE === "all" ? flows : [flows[MODE]]).flatMap(f=>f.steps);
let si = 0, playing = true, timer = null, typer = null, tapT = null, scrT = null, tyT = null, cur = "A", stageNow = 2, free = false;
const phone = document.querySelector(".phone");
function openDrawer(){ $("drawer").innerHTML = S.sidebar(); phone.classList.add("shifted"); $("drawer").classList.add("open"); $("dim").classList.add("open"); }
function closeDrawer(){ phone.classList.remove("shifted"); $("drawer").classList.remove("open"); $("dim").classList.remove("open"); }
function openSheet(){ $("sheet").innerHTML = sheetHTML; requestAnimationFrame(()=>$("sheet").classList.add("open")); }
function closeSheet(){ $("sheet").classList.remove("open"); }
const $ = id => document.getElementById(id);
const layer = () => $("layer"+cur), other = () => $("layer"+(cur==="A"?"B":"A"));

function showTap(sel){
  const el = layer().querySelector(sel) || $("fixed").querySelector(sel);
  if (!el) return;
  const pr = document.querySelector(".phone").getBoundingClientRect(), r = el.getBoundingClientRect(), k = pr.width/390;
  const dot = $("tapdot");
  dot.style.left = ((r.left + r.width/2 - pr.left)/k - 10) + "px";
  dot.style.top  = ((r.top + r.height/2 - pr.top)/k - 10) + "px";
  dot.classList.remove("go"); void dot.offsetWidth; dot.classList.add("go");
}
let rafs = [];
function tween(el, prop, to, dur){
  const from = el[prop], t0 = performance.now(), ease = t => t<.5 ? 2*t*t : -1+(4-2*t)*t;
  const f = now => { const p = Math.min(1,(now-t0)/dur); el[prop] = from + (to-from)*ease(p); if (p<1) rafs.push(requestAnimationFrame(f)); };
  rafs.push(requestAnimationFrame(f));
}
function stopTweens(){ rafs.forEach(cancelAnimationFrame); rafs = []; }
function clearAnim(el){ el.className = el.className.replace(/\ba-\w+/g,"").trim(); }

function enter(s, first){
  if (!s.drawer) closeDrawer();
  const L = layer(), N = other();
  N.innerHTML = s.r(); N.classList.toggle("lockish", !!s.lock); N.scrollTop = 0;
  N.classList.remove("hidden");
  $("status").style.display = s.lock ? "none" : "flex";
  if (s.clock) $("clock").textContent = s.clock;
  // fixed bar: fade out, swap, fade in
  const fx = $("fixed"); fx.style.opacity = 0;
  setTimeout(()=>{ fx.innerHTML = s.fixed; fx.style.opacity = 1; }, first ? 0 : 220);
  clearAnim(L); clearAnim(N);
  if (!first){
    const map = {push:["a-pushIn","a-pushOut"], slideL:["a-slideInL","a-slideOutR"], zoom:["a-zoomIn","a-fadeOut"], close:["a-fadeIn","a-zoomOut"], fade:["a-fadeIn","a-fadeOut"]};
    const [i,o] = map[s.anim||"fade"]; N.classList.add(i); L.classList.add(o);
  }
  setTimeout(()=>{ L.classList.add("hidden"); clearAnim(L); clearAnim(N); }, 520);
  cur = (cur==="A"?"B":"A");
}

function render(first){
  clearTimeout(timer); clearInterval(typer); clearTimeout(tyT); clearTimeout(tapT); clearTimeout(scrT); stopTweens();
  const s = seq[si];
  if (s.stage) stageNow = s.stage;
  closeSheet();
  if (!s.same || free){ enter(s.same ? {...seq[baseOf(si)], anim:"fade"} : s, first); if (s.same) applyState(baseOf(si), si); }
  free = false;
  if (s.drawer) setTimeout(openDrawer, 420);
  if (s.closeDrawer) setTimeout(closeDrawer, 350);
  const L = layer();
  if (s.mutate) setTimeout(s.mutate, playing ? s.dur - 650 : 300);
  if (s.scroll){
    const t = s.scroll.t || 1600;
    scrT = setTimeout(()=>{ if (s.scroll.y!=null) tween(L, "scrollTop", Math.min(s.scroll.y, L.scrollHeight - L.clientHeight), t); const rail = L.querySelector("#rail"); if (rail && s.scroll.x!=null) tween(rail, "scrollLeft", Math.min(s.scroll.x, rail.scrollWidth - rail.clientWidth), t); }, s.same ? 300 : 700);
  }
  if (s.type){
    const el0 = $("fixed"); setTimeout(()=>{ const el = el0.querySelector(".typed"); if (el) el.textContent = ""; }, 240);
    tyT = setTimeout(()=>{ const el = $("fixed").querySelector(".typed"); if(!el) return; let i = 0; el.textContent = "";
      typer = setInterval(()=>{ i += 2; el.textContent = s.type.slice(0, i); if (i >= s.type.length) clearInterval(typer); }, 26); }, s.typeDelay || 500);
  }
  $("bars").innerHTML = seq.map((x,i)=>`<i class="${i<si?'done':i===si?'on':''}"><b></b></i>`).join("");
  if (playing){
    const b = $("bars").querySelector("i.on b");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ b.style.transitionDuration = s.dur+"ms"; b.style.width = "100%"; }));
    if (s.tap) tapT = setTimeout(()=>showTap(s.tap), s.dur - 900);
    timer = setTimeout(()=>{ if (si < seq.length-1){ si++; render(); } else { playing = false; setBtn(); } }, s.dur);
  }
  setBtn();
}
function setBtn(){ $("play").textContent = playing ? "Pause" : (si===seq.length-1 ? "Replay" : "Play"); }
function baseOf(i){ let b = i; while (b > 0 && seq[b].same) b--; return b; }
function applyState(b, upto){
  const L = layer();
  for (let j = b+1; j <= upto; j++){ const st = seq[j]; if (st.closeDrawer) closeDrawer(); if (st.mutate) setTimeout(st.mutate, 300); if (st.scroll){ setTimeout(()=>{ if (st.scroll.y!=null) L.scrollTop = st.scroll.y; const rail = L.querySelector("#rail"); if (rail && st.scroll.x!=null) rail.scrollLeft = st.scroll.x; }, 250); } }
  if (seq[b].drawer && !seq.slice(b+1, upto+1).some(x=>x.closeDrawer)) setTimeout(openDrawer, 300);
}
function restart(){ si = 0; playing = true; closeDrawer(); render(); }
function back(){
  if (si === 0) return;
  clearTimeout(timer); clearInterval(typer); clearTimeout(tyT); clearTimeout(tapT); clearTimeout(scrT); stopTweens(); closeSheet(); closeDrawer();
  si--; const target = seq[si];
  if (target.same){
    const b = baseOf(si); enter({...seq[b], anim:"fade"}, false); applyState(b, si);
    $("bars").innerHTML = seq.map((x,i)=>`<i class="${i<si?'done':i===si?'on':''}"><b></b></i>`).join("");
    if (playing){ const bb = $("bars").querySelector("i.on b"); requestAnimationFrame(()=>requestAnimationFrame(()=>{ bb.style.transitionDuration = target.dur+"ms"; bb.style.width = "100%"; })); timer = setTimeout(()=>{ si++; render(); }, target.dur); }
    setBtn(); free = false;
  } else { free = false; render(); }
}
$("back").onclick = back;

/* ---------- clickable prototype (pauses the video) ---------- */
function pause(){ if (!playing) return; playing = false; clearTimeout(timer); clearTimeout(tapT); clearTimeout(scrT); clearTimeout(tyT); clearInterval(typer); stopTweens(); const b=$("bars").querySelector("i.on b"); if(b){ b.style.transitionDuration="0ms"; b.style.width=getComputedStyle(b).width; } setBtn(); }
let freeName = ""; function go(fn, fixedHtml, anim, name=""){ pause(); free = true; freeName = name; closeSheet(); enter({r:fn, fixed:fixedHtml, anim, clock:$("clock").textContent}, false); }
function tabScreen(t){ return {Home:S.home, Chats:S.chats, Records:S.records, Accounts:S.accounts, Insurance:()=>S.insurance(stageNow)}[t]; }
function advance(){ const was = playing; pause(); if (si < seq.length-1) si++; playing = was; free = false; render(); }

phone.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#appGPT") || t.closest(".notif")) return advance();
  if (t.closest(".send")){ if (free && freeName==="draft") return go(S.sent, compose()+disclaimer, "fade", "sent"); return advance(); }
  if (t.closest(".bar .menu")) { pause(); return openDrawer(); }
  if (t.closest("#sideHealth") || t.closest("#dim")) { pause(); return closeDrawer(); }
  if (t.closest(".bar .back")) return go(S.home, compose(), "slideL");
  const tab = t.closest("[data-tab]"); if (tab) return go(tabScreen(tab.dataset.tab), compose(), "fade");
  if (t.closest(".connect")) { pause(); return openSheet(); }
  if (t.closest("#sheetX") || t.closest("#sheetGo")) { pause(); closeSheet(); return setTimeout(()=>go(S.accounts, compose(), "fade"), 350); }
  const slot = t.closest(".doc .slots button");
  if (slot){ const card = slot.closest(".doc"), idx = [...card.parentNode.children].indexOf(card); picked.doc = doctors[idx]; picked.slot = slot.textContent; slot.classList.add("sel"); pause(); return setTimeout(()=>go(S.draft, compose("Yes, please send")+disclaimer, "fade", "draft"), 450); }
  if (t.closest(".sendmail")) return go(S.sent, compose()+disclaimer, "fade", "sent");
});

$("play").onclick = () => { if (!playing && si===seq.length-1) return restart(); playing = !playing; if (playing) render(); else { clearTimeout(timer); clearTimeout(tapT); const b=$("bars").querySelector("i.on b"); if(b){ b.style.transitionDuration="0ms"; b.style.width=getComputedStyle(b).width; } setBtn(); } };
$("replay").onclick = restart;
$("next").onclick = () => { if (si < seq.length-1){ si++; render(); } else restart(); };
document.addEventListener("keydown", e => { if (e.key==="ArrowRight") $("next").click(); if (e.key==="ArrowLeft") back(); if (e.key===" "){ e.preventDefault(); $("play").click(); } });
render(true);

</script>
</body>
</html>
